openapi: 3.1.0
info:
  title: SeatFlow Restaurant Waitlist API
  description: SaaS-ready multi-tenant restaurant waitlist management system.
  version: 2.2.0
paths:
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Me
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/users:
    get:
      tags:
      - Users
      summary: List Users
      operationId: list_users_api_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserResponse'
                type: array
                title: Response List Users Api Users Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Users
      summary: Create User
      operationId: create_user_api_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/users/{user_id}/role:
    patch:
      tags:
      - Users
      summary: Change User Role
      operationId: change_user_role_api_users__user_id__role_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/waitlist:
    get:
      tags:
      - Waitlist
      summary: Get Waitlist Entries
      operationId: get_waitlist_entries_api_waitlist_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WaitlistResponse'
                type: array
                title: Response Get Waitlist Entries Api Waitlist Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - Waitlist
      summary: Add To Waitlist
      operationId: add_to_waitlist_api_waitlist_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/waitlist/call-next:
    post:
      tags:
      - Waitlist
      summary: Call Next Party
      operationId: call_next_party_api_waitlist_call_next_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
      security:
      - HTTPBearer: []
  /api/waitlist/{entry_id}/status:
    patch:
      tags:
      - Waitlist
      summary: Update Status
      operationId: update_status_api_waitlist__entry_id__status_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          title: Entry Id
      - name: status
        in: query
        required: true
        schema:
          type: string
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/waitlist/{entry_id}/seat:
    post:
      tags:
      - Waitlist
      summary: Seat Party
      operationId: seat_party_api_waitlist__entry_id__seat_post
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/waitlist/{entry_id}/cancel:
    post:
      tags:
      - Waitlist
      summary: Cancel Party
      operationId: cancel_party_api_waitlist__entry_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/waitlist/{entry_id}/no-show:
    post:
      tags:
      - Waitlist
      summary: No Show Party
      operationId: no_show_party_api_waitlist__entry_id__no_show_post
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/waitlist/statistics/summary:
    get:
      tags:
      - Waitlist
      summary: Waitlist Statistics
      operationId: waitlist_statistics_api_waitlist_statistics_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - access_token
      - user
      title: AuthResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    RegisterRequest:
      properties:
        restaurant_name:
          type: string
          maxLength: 150
          minLength: 2
          title: Restaurant Name
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
      type: object
      required:
      - restaurant_name
      - email
      - password
      title: RegisterRequest
    UserCreateRequest:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          maxLength: 128
          minLength: 8
          title: Password
        role:
          type: string
          pattern: ^(manager|staff)$
          title: Role
          default: staff
      type: object
      required:
      - email
      - password
      title: UserCreateRequest
    UserResponse:
      properties:
        id:
          type: integer
          title: Id
        restaurant_id:
          type: integer
          title: Restaurant Id
        email:
          type: string
          title: Email
        role:
          type: string
          title: Role
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - restaurant_id
      - email
      - role
      - is_active
      title: UserResponse
    UserRoleUpdateRequest:
      properties:
        role:
          type: string
          pattern: ^(manager|staff)$
          title: Role
      type: object
      required:
      - role
      title: UserRoleUpdateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WaitlistCreate:
      properties:
        customer_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Customer Name
        phone:
          type: string
          maxLength: 30
          minLength: 1
          title: Phone
        party_size:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Party Size
      type: object
      required:
      - customer_name
      - phone
      - party_size
      title: WaitlistCreate
    WaitlistResponse:
      properties:
        id:
          type: integer
          title: Id
        restaurant_id:
          type: integer
          title: Restaurant Id
        customer_name:
          type: string
          title: Customer Name
        phone:
          type: string
          title: Phone
        party_size:
          type: integer
          title: Party Size
        status:
          type: string
          title: Status
        estimated_wait_minutes:
          type: integer
          title: Estimated Wait Minutes
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - restaurant_id
      - customer_name
      - phone
      - party_size
      - status
      - estimated_wait_minutes
      - created_at
      title: WaitlistResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
