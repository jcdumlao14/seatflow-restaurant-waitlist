name: SeatFlow CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt PyYAML

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest tests -v

  frontend-build:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-integration:
    name: Docker Full-Stack Integration
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt PyYAML

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start full stack
        run: docker compose up -d --build

      - name: Show container status
        run: docker compose ps

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8002/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for backend health... attempt $i/30"
            sleep 2
          done
          echo "Backend did not become healthy."
          docker compose logs backend
          exit 1

      - name: Verify frontend HTTP response
        run: curl --fail --silent --show-error http://127.0.0.1:8080/

      - name: Verify Alembic migration state
        run: docker compose exec -T backend alembic current

      - name: Verify OpenAPI contract
        run: python scripts/verify_openapi_contract.py

      - name: Run Docker full-stack E2E
        run: python scripts/docker_integration_e2e.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shut down full stack
        if: always()
        run: docker compose down -v --remove-orphans
